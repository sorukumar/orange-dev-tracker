<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Core Releases: The complete log of what shipped | Orange Dev Tracker</title>
    <meta name="description" content="The complete log of what shipped in Bitcoin Core, who built it, and how long it took.">
    <link rel="canonical" href="https://tracker.bitcoindatalabs.org/releases.html">

    <!-- Bitcoin Data Labs Font & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bitcoin Data Labs Shell Styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css">

    <!-- Modularized Local Styles -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/releases.css">

    <link rel="icon" type="image/png" href="https://bitcoindatalabs.org/favicon.png">
</head>

<body class="has-fixed-header">
    <div id="main-container">
        <!-- Bitcoin Data Labs Header -->
        <div id="header"></div>

        <div id="app-content">
            <div class="page-hero">
                <p class="hero-narrative">The complete record of what shipped in Bitcoin Core — release by release, PR by PR.</p>
            </div>
            <div class="release-layout-wrapper">
                <!-- Main Content -->
                <main class="release-main">
                    <!-- Dynamic Content Area -->
                    <div id="release-loading" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 15px;">Loading release data...</p>
                    </div>
                    
                    <div id="release-content" class="release-content" style="display: none;">
                        <div class="release-header">
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <div class="version-dropdown-container">
                                    <span style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">Version</span>
                                    <div class="custom-dropdown" id="version-custom-dropdown">
                                        <button class="dropdown-toggle" id="version-dropdown-btn">
                                            <span id="version-dropdown-label">Loading...</span>
                                            <i class="fas fa-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu" id="version-dropdown-menu">
                                            <!-- Populated by JS -->
                                        </div>
                                    </div>
                                </div>
                                <div class="release-status-badge" id="release-status-badge" style="margin: 0; padding: 2px 10px; font-size: 0.75rem;"></div>
                                <span id="release-date" style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 500;"></span>
                            </div>
                            <p id="release-summary" style="color: var(--text-secondary); margin: 12px 0 0 0; font-size: 0.95rem; line-height: 1.5;"></p>
                            <div id="release-highlights-container" style="display: none; margin-top: 20px; padding: 20px; background: rgba(247, 147, 26, 0.08); border-left: 4px solid var(--accent); border-radius: 8px;">
                                <h3 style="margin: 0 0 12px 0; font-size: 1.1rem; color: var(--accent); font-weight: 700;">Release Highlights</h3>
                                <ul id="release-highlights-list" style="margin: 0; padding-left: 20px; color: var(--text-primary); font-size: 0.95rem; line-height: 1.6;">
                                </ul>
                            </div>

                            <div id="release-kpis" class="hero-scorecard" style="display: none;"></div>
                        </div>
                        
                        <div class="search-and-filter-container">
                            <div class="search-container" style="margin-bottom: 20px; display: flex; justify-content: center;">
                                <input type="text" id="pr-search-input" placeholder="Search PRs by title, author, or number..." style="width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); background: var(--card-bg); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s;">
                            </div>
                            <div id="filter-container" class="filter-container">
                                <!-- Filter pills populated by JS -->
                            </div>
                        </div>
                        
                        <div id="top-contributors-container" style="display: none; margin-bottom: 24px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border-color);">
                            <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 16px; font-weight: 700; text-align: center;">Top Contributors to this Release</div>
                            <div id="top-contributors-list" style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;"></div>
                        </div>
                        
                        <div class="pr-list-container" id="pr-list-container">
                            <!-- PRs populated by JS -->
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Bitcoin Data Labs Footer -->
        <div id="footer"></div>
    </div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js"></script>
    <script src="js/app-config.js"></script>
    <script src="js/utils.js"></script>

    <!-- Page Logic -->
    <script src="js/releases.js"></script>
</body>

</html>

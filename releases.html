<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Core Releases | Orange Dev Tracker</title>
    <meta name="description" content="Explore Bitcoin Core release cycles, including past, present, and future planned releases.">
    <link rel="canonical" href="https://sorukumar.github.io/orange-dev-tracker/releases.html">

    <!-- Bitcoin Data Labs Font & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bitcoin Data Labs Shell Styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css">

    <!-- Modularized Local Styles -->
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/releases.css">

    <link rel="icon" type="image/png" href="https://bitcoindatalabs.org/favicon.png">
</head>

<body class="has-fixed-header">
    <div id="main-container">
        <!-- Bitcoin Data Labs Header -->
        <div id="header"></div>

        <div id="app-content">
            <div class="release-layout-wrapper">
                <!-- Main Content -->
                <main class="release-main">
                    <!-- Dynamic Content Area -->
                    <div id="release-loading" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 15px;">Loading release data...</p>
                    </div>
                    
                    <div id="release-content" class="release-content" style="display: none;">
                        <div class="release-header">
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <div class="version-dropdown-container">
                                    <span style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">Version</span>
                                    <div class="custom-dropdown" id="version-custom-dropdown">
                                        <button class="dropdown-toggle" id="version-dropdown-btn">
                                            <span id="version-dropdown-label">Loading...</span>
                                            <i class="fas fa-chevron-down"></i>
                                        </button>
                                        <div class="dropdown-menu" id="version-dropdown-menu">
                                            <!-- Populated by JS -->
                                        </div>
                                    </div>
                                </div>
                                <div class="release-status-badge" id="release-status-badge" style="margin: 0; padding: 2px 10px; font-size: 0.75rem;"></div>
                                <span id="release-date" style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 500;"></span>
                            </div>
                            <p id="release-summary" style="color: var(--text-secondary); margin: 12px 0 0 0; font-size: 0.95rem; line-height: 1.5;"></p>
                        </div>
                        
                        <div id="filter-container" class="filter-container">
                            <!-- Filter pills populated by JS -->
                        </div>
                        
                        <div class="pr-list-container" id="pr-list-container">
                            <!-- PRs populated by JS -->
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Bitcoin Data Labs Footer -->
        <div id="footer"></div>
    </div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js"></script>
    <script src="js/app-config.js"></script>
    <script src="js/utils.js"></script>

    <!-- Page Logic -->
    <script src="js/releases.js"></script>
</body>

</html>
